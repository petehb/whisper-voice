name: Build tablet app

on:
  push:
    paths: ['android-src.tgz', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the Android project
        run: mkdir -p android && tar -xzf android-src.tgz -C android && find android -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish it as the latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gabs-voice.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest gabs-voice.apk \
            --title "Gabs' Voice tablet app (build ${{ github.run_number }})" \
            --notes "Download gabs-voice.apk on the tablet and open it to install or update."
